name: Build Supervisor

on:
  workflow_dispatch:
    inputs:
      supervisor_version:
        description: 'Supervisor version (e.g. 2026.02.2)'
        type: string
        required: true

env:
  TARGET_IMAGE: ghcr.io/lovely-him/aarch64-hassio-supervisor

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            SUPERVISOR_VERSION=${{ inputs.supervisor_version }}
          tags: |
            ${{ env.TARGET_IMAGE }}:${{ inputs.supervisor_version }}
            ${{ env.TARGET_IMAGE }}:latest
